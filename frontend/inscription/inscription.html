<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BraCovoit — Inscription</title>
    <link rel="stylesheet" href="inscription.css" />
    <link rel="stylesheet" href="../layout.css" />
  </head>
  <body id="page-inscription">
    <!-- NAVIGATION — TODO (Dev FS7) -->
    <a href="../accueil/index.html" class="retour-accueil">
      Retour à l'accueil</a
    >

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-subtitle">
          Rejoignez Tokende pour réserver ou proposer un trajet à Brazzaville.
        </p>

        <!-- =====================================================================
           FORMULAIRE — TODO (Dev FS7)
           Mettre en forme le formulaire d'inscription : nom, téléphone,
           mot de passe. Prévoir un layout clair en colonne, avec des labels
           visibles pour chaque champ.

           *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
           ===================================================================== -->
        <form id="form-inscription" class="auth-form">
          <div class="form-field">
            <label for="i-nom">Nom</label>
            <input type="text" id="i-nom" />
          </div>

          <div class="form-field">
            <label for="i-telephone">Téléphone</label>
            <input type="tel" id="i-telephone" placeholder="066123456" />
          </div>

          <div class="form-field">
            <label for="i-mot-de-passe">Mot de passe</label>
            <input type="password" id="i-mot-de-passe" />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Créer mon compte
          </button>
        </form>

        <!-- Zone d'erreurs de validation — TODO (Dev FS7) : mettre en forme la
           liste <ul><li> injectée par main.js en cas de formulaire invalide.
           NE PAS MODIFIER l'id. -->
        <div id="erreurs-form" class="form-errors" hidden></div>

        <!-- LIEN VERS LOGIN — TODO (Dev FS7) : lien "Déjà un compte ? Se connecter"
           pointant vers ../login/login.html -->
        <p class="auth-switch">
          Déjà un compte ?
          <a href="../login/login.html">Se connecter</a>
        </p>
      </div>
    </main>

    <div id="erreur-globale" hidden></div>

    <script src="../layout.js"></script>
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
</html>
