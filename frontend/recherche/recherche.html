<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Recherche</title>
  <link rel="stylesheet" href="recherche.css">
</head>
<body id="page-recherche">

  <!-- NAVIGATION — TODO (Dev FS2) -->
  <header class="site-nav">
    <div class="site-nav-inner">
      <a href="../accueil/index.html" class="logo">
        <span class="logo-mark" aria-hidden="true">↗</span> Tokende
      </a>
      <nav class="nav-links">
        <a href="../accueil/index.html">Accueil</a>
        <a href="recherche.html" class="active">Rechercher un trajet</a>
        <a href="../proposer/proposer.html">Proposer un trajet</a>
        <a href="../mes-trajets/mes-trajets.html">Mes réservations</a>
      </nav>

      <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
      <div id="nav-session"></div>
    </div>
  </header>

  <main>
    <a href="../accueil/index.html" class="retour-accueil">← Retour à l'accueil</a>

    <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Mettre en forme la barre de filtres : sélecteur de quartier de
         départ, champ de recherche libre, bouton de lancement. Layout en
         ligne sur desktop, empilé sur mobile.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="barre-filtres">
      <select id="filtre-depart"></select>
      <input type="text" id="champ-recherche" placeholder="Rechercher un quartier, un mot-clé...">
      <button id="btn-rechercher">Rechercher</button>
    </section>

    <!-- =====================================================================
         AJOUT VISUEL — sidebar filtres + tri, inspiré de la maquette.
         ⚠️ Décoratif : ces contrôles ne sont PAS câblés à main.js/logic.py
         (aucune fonction de tri/filtre prix/période/véhicule dans le scaffold).
         Ils ne filtrent rien tant que personne ne code la logique derrière.
         ===================================================================== -->
    <div class="layout-recherche">
      <aside class="sidebar-filtres">
        <h2>Filtrer les trajets</h2>

        <div class="filtre-groupe">
          <span class="filtre-label">Prix maximum</span>
          <div class="prix-card">
            <span class="prix-sous-label">Par personne</span>
            <span class="prix-valeur">1500 FCFA</span>
          </div>
          <input type="range" min="0" max="2000" value="1500" class="slider-prix" aria-label="Prix maximum">
          <div class="slider-bornes"><span>0 FCFA</span><span>2 000 FCFA</span></div>
        </div>

        <div class="filtre-groupe">
          <span class="filtre-label">Période</span>
          <div class="pills">
            <button type="button" class="pill pill-active">Tous</button>
            <button type="button" class="pill">Matin (6h–12h)</button>
            <button type="button" class="pill">Midi (12h–14h)</button>
            <button type="button" class="pill">Après-midi (14h–18h)</button>
            <button type="button" class="pill">Soir (+18h)</button>
          </div>
        </div>

        <div class="filtre-groupe">
          <span class="filtre-label">Véhicule</span>
          <div class="pills">
            <button type="button" class="pill pill-active">Tous</button>
            <button type="button" class="pill">Berline</button>
            <button type="button" class="pill">Citadine</button>
            <button type="button" class="pill">SUV</button>
          </div>
        </div>

        <div class="filtre-toggle">
          <div>
            <span class="filtre-label">Conducteurs vérifiés</span>
            <span class="toggle-souslabel">Uniquement les profils certifiés</span>
          </div>
          <input type="checkbox" class="toggle" aria-label="Conducteurs vérifiés uniquement">
        </div>

        <div class="mini-carte" aria-hidden="true">
          <span class="mini-carte-tag">Aperçu de l'itinéraire</span>
          <svg viewBox="0 0 200 110" class="mini-carte-svg">
            <circle cx="20" cy="20" r="4" fill="#2563EB"/>
            <path d="M20 20 L120 45" stroke="#93C5FD" stroke-width="2" fill="none"/>
            <path d="M20 60 L140 80" stroke="#93C5FD" stroke-width="2" fill="none"/>
            <circle cx="150" cy="90" r="4" fill="#F59E0B"/>
          </svg>
        </div>
      </aside>

      <div class="contenu-resultats">
        <div class="resultats-entete">
          <span id="nb-resultats" class="nb-resultats"></span>
          <div class="tri-boutons">
            <button type="button" class="tri-btn tri-btn-active">Départ tôt</button>
            <button type="button" class="tri-btn">Départ tard</button>
            <button type="button" class="tri-btn">Prix ↑</button>
            <button type="button" class="tri-btn">Prix ↓</button>
            <button type="button" class="tri-btn">Durée</button>
          </div>
        </div>

        <!-- =====================================================================
             RÉSULTATS — TODO (Dev FS2)
             main.js remplit ce conteneur avec des cartes .carte-trajet, chacune
             contenant un <h3>, un <p class="heure">, un <p class="conducteur">,
             un <p class="prix">, un <span class="badge badge-dispo|badge-limite|
             badge-complet">, et un lien <a class="btn-voir">. Stylez ces
             éléments (déjà présents dans le HTML généré par main.js — vous ne
             les créez pas ici, vous écrivez le CSS qui les habille).
             Layout : grille responsive (1 colonne mobile, 2-3 colonnes desktop).
             Gérez aussi l'état "aucun résultat" (classe .aucun-resultat).

             *** NE PAS MODIFIER l'id ci-dessous ***
             ===================================================================== -->
        <section id="liste-trajets"></section>
      </div>
    </div>
  </main>

  <div id="erreur-globale" hidden></div>

  <!-- NE PAS MODIFIER -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
